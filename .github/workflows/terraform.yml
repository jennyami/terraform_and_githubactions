name: "Terraform Infrastructure"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write # REQUIRED: This allows OIDC authentication

jobs:
  print_title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Use actions/checkout@v4 for security best practices
        uses: actions/checkout@v4 

      - name: Set PR title as environment variable
        run: echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
        # Using GITHUB_ENV makes the variable available to subsequent steps in the same job.

      - name: Print Title of PR
        # Safely use the environment variable
        run: echo "The Title of your PR is ${{ env.PR_TITLE }}"
        
  list-files-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with sufficient depth
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch at least 2 commits to compare the head with its parent
          fetch-depth: 2 

      - name: Get changed files
        id: changed-files
        run: |
          # Use git diff to compare the current HEAD with its parent commit
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD | xargs)
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Display changed files
        run: |
          for file in ${{ steps.changed-files.outputs.changed_files }}; do
            echo "$file was changed"
          done

  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: "./."

    steps:
      # 1. Checkout the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Log into AWS using OIDC (No secret keys needed!)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} 
          aws-region: ap-southeast-1

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform (Connect to S3)
      - name: Terraform Init
        id: init
        run: terraform init

      # 5. Check Code Style
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      # 6. Terraform Plan (Runs on Pull Requests)
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        # -no-color ensures the GitHub comment looks clean
        run: terraform plan -no-color -input=false
        continue-on-error: true

      # 7. Post the Plan as a Comment (The "Showcase" Feature)
      - name: Update PR with Plan
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # 8. Fail if Plan failed
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # 9. Terraform Apply (Runs on Merge to dev or main)
      - name: Terraform Apply
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: terraform apply -auto-approve -input=false
